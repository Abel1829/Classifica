services:
  db:
    image: postgres:16
    container_name: classifica-db
    environment:
      POSTGRES_DB: classifica
      POSTGRES_USER: classifica
      POSTGRES_PASSWORD: classifica
    ports:
      - "5433:5432"
    volumes:
      - classifica-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classifica -d classifica"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: classifica-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/classifica
      SPRING_DATASOURCE_USERNAME: classifica
      SPRING_DATASOURCE_PASSWORD: classifica
    ports:
      - "8081:8080"

volumes:
  classifica-data: